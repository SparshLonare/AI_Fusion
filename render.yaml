services:
  - type: web
    name: codehelper
    runtime: python
    plan: starter
    buildCommand: >-
      pip install -r requirements.txt &&
      DJANGO_DATA_DIR=/tmp CHROMA_DB_PATH=/tmp/chroma_db
      python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python -m gunicorn codehelper.wsgi:application --bind 0.0.0.0:$PORT
    disk:
      name: codehelper-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: DJANGO_DATA_DIR
        value: /var/data
      - key: CHROMA_DB_PATH
        value: /var/data/chroma_db
