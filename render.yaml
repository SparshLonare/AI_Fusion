services:
  - type: web
    name: codehelper
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py seed_kb &&
      python manage.py collectstatic --noinput
    startCommand: python manage.py migrate && python -m gunicorn codehelper.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
